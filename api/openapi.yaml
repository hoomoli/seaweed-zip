  "components": {
    "securitySchemes": {
      "consumerCapability": {
        "type": "http",
        "scheme": "bearer",
        "description": "256-bit consumer capability; hash only in SQLite"
      }
    },
    "schemas": {
      "CreateRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sourceId",
          "bucket",
          "game",
          "platform",
          "release",
          "manifestSha256",
          "manifestUrl",
          "objects",
          "clientRequestId",
          "contractVersion",
          "canonicalManifestHash"
        ],
        "properties": {
          "sourceId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "pattern": "^[A-Za-z0-9._-]{1,256}$"
          },
          "bucket": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "pattern": "^[A-Za-z0-9._-]{1,256}$"
          },
          "game": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "pattern": "^[A-Za-z0-9._-]{1,256}$"
          },
          "platform": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "pattern": "^[A-Za-z0-9._-]{1,256}$"
          },
          "release": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "pattern": "^[A-Za-z0-9._-]{1,256}$"
          },
          "clientRequestId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "pattern": "^[A-Za-z0-9._-]{1,256}$"
          },
          "manifestSha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$",
            "description": "SHA256 of exact immutable original GET bytes; distinct from the ZIP digest."
          },
          "canonicalManifestHash": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$",
            "description": "SHA256 of the independently reconstructed canonical release manifest including trailing LF; supported immutable manifests must already be canonical."
          },
          "manifestUrl": {
            "type": "string",
            "format": "uri",
            "writeOnly": true
          },
          "objects": {
            "type": "array",
            "minItems": 1,
            "maxItems": 10000,
            "items": {
              "$ref": "#/components/schemas/Object"
            }
          },
          "node": {
            "type": "string",
            "maxLength": 256,
            "pattern": "^[A-Za-z0-9._-]{1,256}$"
          },
          "deployment": {
            "type": "string",
            "maxLength": 256,
            "pattern": "^[A-Za-z0-9._-]{1,256}$"
          },
          "contractVersion": {
            "type": "string",
            "const": "release-manifest-v1"
          }
        }
      },
      "Object": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sha256",
          "size",
          "url"
        ],
        "properties": {
          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "size": {
            "type": "integer",
            "minimum": 0
          },
          "url": {
            "type": "string",
            "format": "uri",
            "writeOnly": true
          }
        }
      },
      "State": {
        "type": "string",
        "enum": [
          "QUEUED",
          "VALIDATING",
          "PACKING",
          "READY",
          "DELETING",
          "DELETED",
          "WAITING_AUTH",
          "FAILED",
          "CANCELLED"
        ]
      },
      "Created": {
        "type": "object",
        "properties": {
          "packId": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "consumerId": {
            "type": "string"
          },
          "consumerToken": {
            "type": "string",
            "writeOnly": true
          },
          "state": {
            "$ref": "#/components/schemas/State"
          },
          "statusUrl": {
            "type": "string"
          }
        }
      },
      "Pack": {
        "type": "object",
        "properties": {
          "generation": {
            "type": "integer"
          },
          "doneBytes": {
            "type": "integer"
          },
          "doneObjects": {
            "type": "integer"
          },
          "bytes": {
            "type": "integer"
          },
          "createdAt": {
            "type": "integer"
          },
          "readyAt": {
            "type": "integer"
          },
          "deleteAfter": {
            "type": "integer"
          },
          "deletedAt": {
            "type": "integer"
          },
          "packId": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "state": {
            "$ref": "#/components/schemas/State"
          },
          "identity": {
            "type": "object",
            "description": "Safe source/manifest identity and unique objects; no URLs or idempotency key"
          },
          "artifactSha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "error": {
            "type": "string"
          },
          "consumerCount": {
            "type": "integer",
            "minimum": 0
          },
          "ackCount": {
            "type": "integer",
            "minimum": 0
          },
          "activeDownloads": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Consumer": {
        "type": "object",
        "properties": {
          "consumerId": {
            "type": "string"
          },
          "packId": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "generation": {
            "type": "integer"
          },
          "ack": {
            "type": "boolean"
          },
          "cancelled": {
            "type": "boolean"
          },
          "node": {
            "type": "string"
          },
          "deployment": {
            "type": "string"
          },
          "createdAt": {
            "type": "integer"
          },
          "downloadLease": {
            "type": "integer",
            "description": "Active download lease expiry, Unix seconds; 0 when inactive"
          }
        }
      },
      "Event": {
        "type": "object",
        "properties": {
          "phase": {
            "type": "string"
          },
          "code": {
            "type": "string"
          },
          "at": {
            "type": "integer"
          }
        }
      },
      "Status": {
        "type": "object",
        "properties": {
          "pack": {
            "$ref": "#/components/schemas/Pack"
          },
          "consumer": {
            "$ref": "#/components/schemas/Consumer"
          },
          "downloadPath": {
            "type": "string"
          }
        }
      },
      "Problem": {
        "type": "object",
        "required": [
          "type",
          "title",
          "status",
          "phase",
          "code",
          "requestId"
        ],
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "phase": {
            "type": "string"
          },
          "code": {
            "type": "string"
          },
          "requestId": {
            "type": "string"
          }
        }
      }
    }
  }
}
